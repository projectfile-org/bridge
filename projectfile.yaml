org:
  projectfile:
    artifacts:
      go-binary:
        command: pf-bridge
        kind: binary
        path: dist/pf-bridge
    ignores:
      git:
        include:
          # Local-only Go workspace file: a worktree cannot see the workspace
          # go.work one level above the repositories, so it writes its own.
          - go.work
    ci:
      forgejo:
        credentials:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      nodes:
        binaries-built:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        gsa:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        binaries-released:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
    readme:
      usage:
        - commands:
            - pf-bridge --list
            - pf-bridge readme --force
            - pf-bridge all
          name: binary
          prefix: 'Project the projectfile onto the files a forge expects:'
    status: maintained
repositories:
  - issues: true
    role: mirror
    type: git
    url: ssh://git@codeberg.org/projectfile/bridge.git
  - role: mirror
    type: git
    url: git@github.com:damian-buho/projectfile-bridge.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/projectfile/bridge.git
technologies:
  - go
