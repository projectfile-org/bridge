org:
  projectfile:
    artifacts:
      go-binary:
        command: pf-bridge
        kind: binary
        path: dist/pf-bridge
    ignores:
      git:
        include:
          # Local-only Go workspace file: a worktree cannot see the workspace
          # go.work one level above the repositories, so it writes its own.
          - go.work
        # FETCH_PATH points at XDG_CACHE_HOME (m6e core/base/125-artifacts.mk), so no ./fetch marker ever lands here.
        exclude:
          - .fetch
      # .fetch is XDG-homed (see above); .gitlab has no consumer anywhere; lefthook is pinned to lefthook.yaml; scaffold is the b19 base-image template source, which a Go-binary project never carries.
      container:
        exclude:
          - .fetch
          - .gitlab
          - lefthook.yml
          - scaffold
    architecture:
      - amd64
      - arm64
      - riscv64
    operating-system:
      - linux
    ci:
      nodes:
        binaries-are-built:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        gsa:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        binaries-are-signed:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        binaries-are-released:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
    readme:
      usage:
        - commands:
            - pf-bridge --list
            - pf-bridge readme --force
            - pf-bridge all
          name: binary
          prefix: 'Project the projectfile onto the files a forge expects:'
    status: maintained
repositories:
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/projectfile/bridge.git
  - role: mirror
    type: git
    url: git@github.com:projectfile-org/bridge.git
technologies:
  - go
