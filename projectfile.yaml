# SPDX-License-Identifier: MIT
$schema: https://projectfile.org/schema/v1.json
copyright:
  year: 2026
identity:
  created: "2026-07-07"
  name: bridge
  summary:
    en: pf-bridge projects the projectfile onto files, forges, and the repository
    es: pf-bridge proyecta el projectfile sobre archivos, forges y el repositorio
    uk: pf-bridge проєктує projectfile на файли, forge-майданчики та репозиторій
  title: Projectfile Bridges
  description:
    en: 'pf-bridge is the projection tool of the projectfile: it derives forge identity files, assembles feature and roadmap fragments, and projects the projectfile onto the files a forge and repository expect. Companion binary to pf-cli for the projectfile.org tooling.'
    es: 'pf-bridge es la herramienta de proyección del projectfile: deriva los archivos de identidad del forge, ensambla los fragmentos de características y hoja de ruta, y proyecta el projectfile sobre los archivos que un forge y un repositorio esperan. Binario compañero de pf-cli para las herramientas de projectfile.org.'
    uk: 'pf-bridge — інструмент проєктування projectfile: він створює файли ідентичності forge-майданчика, збирає фрагменти функцій і дорожньої карти та проєктує projectfile на файли, яких очікують forge і репозиторій. Бінарник-компаньйон pf-cli в інструментарії projectfile.org.'
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/go.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/library/languages/go.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/projectfile/metadata/raw/branch/main/include.yaml
kind: SoftwareSourceCode
org:
  projectfile:
    artifacts:
      go-binary:
        command: pf-bridge
        kind: binary
        path: dist/pf-bridge
    ignores:
      git:
        include:
          # Local-only Go workspace file: a worktree cannot see the workspace
          # go.work one level above the repositories, so it writes its own.
          - go.work
    build:
      args:
        GOPROXY: ""
    ci:
      env:
        GOPROXY: https://kiota.ch/api/packages/projectfile/go,direct
      forgejo:
        credentials:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      nodes:
        binaries-built:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
              GOOS:
                - linux
                - darwin
          needs:
            build-binaries: true
            source-is-ready: true
        gsa:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
              GOOS:
                - linux
                - darwin
          needs:
            binaries-built: true
            auto-gsa: true
        binaries-ready:
          needs:
            binaries-built: true
            gsa: true
        binaries-released:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
              GOOS:
                - linux
                - darwin
          needs:
            binaries-ready: true
            forgejo-release: true
            gh-release: true
          when:
            events:
              - tag
        published:
          needs:
            binaries-released: true
            install-binary: true
      tools:
        build-binaries:
          artifact: dist
          env:
            - GOPROXY
            - GOOS
            - GOARCH
            - GITHUB_REF_NAME
          guard: go.mod
          image: GO_TOOL_IMAGE
          m6e:
            prefer-local: true
          run: .scripts/build-binaries.sh
        forgejo-release:
          action: forgejo-release
          env:
            - FORGEJO_TOKEN
          gha: false
          m6e: false
        gh-release:
          env:
            - GH_TOKEN
          forgejo: false
          m6e: false
          run: .scripts/gh-release.sh "$${{ github.ref_name }}"
        install-binary:
          forgejo: false
          gha: false
          run: .scripts/install-binary.sh
    readme:
      usage:
        - commands:
            - pf-bridge --list
            - pf-bridge readme --force
            - pf-bridge all
          name: binary
          prefix: 'Project the projectfile onto the files a forge expects:'
    status: maintained
repositories:
  - issues: true
    role: mirror
    type: git
    url: ssh://git@codeberg.org/projectfile/bridge.git
  - role: mirror
    type: git
    url: git@github.com:damian-buho/projectfile-bridge.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/projectfile/bridge.git
links:
  - label:
      en: Projectfile Bridges on Codeberg
      es: Projectfile Bridges en Codeberg
      uk: Projectfile Bridges на Codeberg
    tags:
      - public
      - badges
      - badges-gitea
    type: source-code
    url: https://codeberg.org/projectfile/bridge
  - label:
      en: Projectfile Bridges on GitHub
      es: Projectfile Bridges en GitHub
      uk: Projectfile Bridges на GitHub
    tags:
      - public
      - badges
      - badges-github
    type: source-code
    url: https://github.com/damian-buho/projectfile-bridge
  - label:
      en: Projectfile Bridges on kiota.ch
      es: Projectfile Bridges en kiota.ch
      uk: Projectfile Bridges на kiota.ch
    preferred: true
    tags:
      - ci
    type: source-code
    url: https://kiota.ch/projectfile/bridge
  - label:
      en: Issues on Codeberg
      es: Incidencias en Codeberg
      uk: Задачі на Codeberg
    tags:
      - support
    type: bugs
    url: https://codeberg.org/projectfile/bridge/issues
  - label:
      en: Documentation
      es: Documentación
      uk: Документація
    preferred: true
    type: documentation
    url: /docs
  - label:
      en: Issues on GitHub
      es: Incidencias en GitHub
      uk: Задачі на GitHub
    tags:
      - support
    type: bugs
    url: https://github.com/damian-buho/projectfile-bridge/issues
keywords:
  - pf-bridge
  - projectfile
  - forge
  - codegen
  - scaffolding
  - go
  - cli
technologies:
  - go
license:
  covers: project
  spdx: "MIT"
