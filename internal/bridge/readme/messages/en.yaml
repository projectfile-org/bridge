# The canonical readme message catalog. Every other messages/<lang>.yaml is a
# translation of exactly these keys — a key missing there falls back to here.
#
# A `%s` is a Markdown link target the bridge substitutes at render time; keep
# exactly one per body string. Titles double as the link text in their own
# block, so they are repeated inside the body sentence rather than interpolated:
# a language that declines nouns needs both forms independently.

