# The canonical readme message catalog. Every other messages/<lang>.yaml is a
# translation of exactly these keys — a key missing there falls back to here.
#
# A doc-link body string carries two indexed verbs: `%[1]s` is the companion
# file's bare name (the visible link text — a localized readme never offers a
# translated label for a canonical-named file), and `%[2]s` is its target
# rebased relative to the document's own path. The section title (above) still
# names the block in the reader's language. `license.body` is the exception:
# its single `%s` is the SPDX identifier, not a link.

# Blocks
